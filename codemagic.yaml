workflows:
  android-debug:
    name: Android Debug APK
    instance_type: linux
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Unit test
        script: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest
      - name: Build APK debug
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - aryoda69@gmail.com
        notify:
          success: true
          failure: true
